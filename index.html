<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family J.K.A</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f5f6fa;
    color: #1a1a2e;
  }
  h1 { font-size: 1.8rem; margin-bottom: 4px; }
  p { color: #555; }
  button {
    background: #2d5bff;
    color: white;
    border: none;
    padding: 14px 22px;
    font-size: 1rem;
    border-radius: 10px;
    margin-top: 12px;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  #estado {
    margin-top: 14px;
    font-size: 0.95rem;
    color: #333;
  }
  #mapa {
    margin-top: 18px;
    height: 360px;
    width: 100%;
    border-radius: 12px;
  }
  #lista {
    margin-top: 16px;
    font-size: 0.9rem;
    color: #444;
  }
  #lista div {
    padding: 6px 0;
    border-bottom: 1px solid #e0e0e0;
  }
  #perfil {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  #perfil img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
  }
  #cerrarSesion {
    background: #e0e0e0;
    color: #333;
    padding: 8px 14px;
    font-size: 0.85rem;
    margin-top: 0;
  }
  #app { display: none; }
</style>
</head>
<body>

  <h1>Bienvenido a Family J.K.A</h1>
  <p>Aplicación para compartir ubicación de forma segura.</p>

  <div id="login">
    <button id="btnGoogle">Iniciar sesión con Google</button>
  </div>

  <div id="app">
    <div id="perfil">
      <img id="fotoPerfil" src="" alt="">
      <span id="nombrePerfil"></span>
      <button id="cerrarSesion">Cerrar sesión</button>
    </div>

    <button id="btnUbicacion">Compartir mi ubicación</button>

    <div id="estado"></div>
    <div id="mapa"></div>
    <div id="lista"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBxSY-ZF3ZTzwXNBnQqbHsjBycflSKD9Fs",
      authDomain: "family-jka.firebaseapp.com",
      databaseURL: "https://family-jka-default-rtdb.firebaseio.com",
      projectId: "family-jka",
      storageBucket: "family-jka.firebasestorage.app",
      messagingSenderId: "805548842097",
      appId: "1:805548842097:web:135e3c57bbd57574454fd0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    let miNombre = null;

    const loginDiv = document.getElementById('login');
    const appDiv = document.getElementById('app');
    const btnGoogle = document.getElementById('btnGoogle');
    const cerrarSesion = document.getElementById('cerrarSesion');
    const fotoPerfil = document.getElementById('fotoPerfil');
    const nombrePerfil = document.getElementById('nombrePerfil');

    btnGoogle.addEventListener('click', () => {
      auth.signInWithPopup(provider).catch((error) => {
        alert('No se pudo iniciar sesión: ' + error.message);
      });
    });

    cerrarSesion.addEventListener('click', () => {
      auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        miNombre = user.displayName || user.email;
        fotoPerfil.src = user.photoURL || '';
        nombrePerfil.textContent = miNombre;
        loginDiv.style.display = 'none';
        appDiv.style.display = 'block';
      } else {
        miNombre = null;
        loginDiv.style.display = 'block';
        appDiv.style.display = 'none';
      }
    });

    const boton = document.getElementById('btnUbicacion');
    const estado = document.getElementById('estado');
    const listaDiv = document.getElementById('lista');

    const mapa = L.map('mapa').setView([4.6, -74.1], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    const marcadores = {};

    boton.addEventListener('click', () => {
      if (!miNombre) {
        estado.textContent = 'Necesitas iniciar sesión primero.';
        return;
      }
      if (!navigator.geolocation) {
        estado.textContent = 'Tu navegador no soporta geolocalización.';
        return;
      }

      estado.textContent = 'Obteniendo tu ubicación...';

      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;

          db.ref('ubicaciones/' + miNombre).set({
            lat: lat,
            lon: lon,
            actualizado: Date.now()
          });

          estado.textContent = `Ubicación compartida: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
        },
        () => {
          estado.textContent = 'No se pudo obtener tu ubicación. Revisa los permisos.';
        },
        { enableHighAccuracy: true }
      );
    });

    db.ref('ubicaciones').on('value', (snapshot) => {
      const datos = snapshot.val() || {};
      listaDiv.innerHTML = '';

      const nombres = Object.keys(datos);
      if (nombres.length === 0) return;

      nombres.forEach((nombre) => {
        const { lat, lon, actualizado } = datos[nombre];

        if (marcadores[nombre]) {
          marcadores[nombre].setLatLng([lat, lon]);
        } else {
          marcadores[nombre] = L.marker([lat, lon]).addTo(mapa).bindPopup(nombre);
        }

        const hora = new Date(actualizado).toLocaleTimeString();
        const fila = document.createElement('div');
        fila.textContent = `${nombre} — actualizado ${hora}`;
        listaDiv.appendChild(fila);
      });

      if (miNombre && datos[miNombre]) {
        mapa.setView([datos[miNombre].lat, datos[miNombre].lon], 14);
      }
    });
  </script>

</body>
</html>
